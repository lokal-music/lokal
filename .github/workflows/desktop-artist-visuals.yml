name: Desktop artist editorial visuals

on:
  pull_request:
    paths:
      - 'electron/artwork/artistVisuals.js'
      - 'electron/artwork/motion.js'
      - 'electron/ipc/artworkFx.js'
      - 'electron/preload.js'
      - 'src/artistVisuals.js'
      - 'src/components/ArtistEditorialMedia.jsx'
      - 'src/pages/Artist.jsx'
      - 'src/components/OnlineArtist.jsx'
      - 'src/api.js'
      - 'scripts/artist-visuals.test.mjs'
      - 'package.json'
      - '.github/workflows/desktop-artist-visuals.yml'
  push:
    paths:
      - 'electron/artwork/artistVisuals.js'
      - 'electron/artwork/motion.js'
      - 'electron/ipc/artworkFx.js'
      - 'src/artistVisuals.js'
      - 'src/components/ArtistEditorialMedia.jsx'
      - 'scripts/artist-visuals.test.mjs'
      - '.github/workflows/desktop-artist-visuals.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  artist-visuals:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Diagnose parser and cache regressions
        continue-on-error: true
        run: node --test --test-name-pattern='Apple artist editorial|malformed JSON|a cached namesake|verified logo' scripts/artist-visuals.test.mjs
      - name: Diagnose redirect and video-only regressions
        continue-on-error: true
        run: node --test --test-name-pattern='Apple artist page redirects|artist video works' scripts/artist-visuals.test.mjs
      - name: Diagnose uncommon-title and canonical URL regressions
        continue-on-error: true
        run: node --test --test-name-pattern='uncommon local tracks|a generic artist URL' scripts/artist-visuals.test.mjs
      - name: Verify editorial parsing, identity, cache and persistence
        run: npm run test:artist-visuals
      - name: Verify moving cover compatibility
        run: npm run test:motion-covers
      - name: Validate desktop syntax
        run: npm run test:electron-syntax
      - name: Compile renderer
        run: |
          npm run gen:icons
          npx vite build
      - name: Attach failing test detail to PR for diagnosis
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run test:artist-visuals > "${RUNNER_TEMP}/artist-output.log" 2>&1 || true
          {
            printf 'Temporary diagnostic from artist-visuals CI:\n\n```text\n'
            tail -n 100 "${RUNNER_TEMP}/artist-output.log" | head -c 6000
            printf '\n```\n'
          } > "${RUNNER_TEMP}/artist-comment.md"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "${RUNNER_TEMP}/artist-comment.md"
