name: Desktop LastWave and background lyrics
on:
  pull_request:
    paths:
      - 'electron/online/addons.js'
      - 'electron/online/sources.js'
      - 'electron/ipc/online.js'
      - 'src/api.js'
      - 'src/pages/Albums.jsx'
      - 'electron/online/addonDash.js'
      - 'electron/online/addonHybrid.js'
      - 'electron/online/stagedMediaTrim.js'
      - 'electron/main.js'
      - 'electron/online/addonHybridCenc.js'
      - 'electron/lyrics/flacVorbis.js'
      - 'electron/lyrics/providers/local.js'
      - 'electron/lyrics/service.js'
      - 'src/lyrics/supportingVocals.mjs'
      - 'src/components/LyricsPanel.jsx'
      - 'src/lyrics/timing.js'
      - 'scripts/lastwave-desktop-port.test.mjs'
      - 'scripts/lastwave-diagnostics.test.mjs'
      - 'scripts/album-full-artwork.test.mjs'
      - 'scripts/lastwave-hybrid-cenc.test.mjs'
      - 'scripts/staged-media-cache-trim.test.mjs'
      - 'scripts/desktop-background-lyrics-port.test.mjs'
      - 'scripts/lyrics-focus-hold.test.mjs'
      - '.github/workflows/lastwave-background-lyrics-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  port-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify backend syntax
        run: |
          node --check electron/online/addons.js
          node --check electron/online/sources.js
          node --check electron/ipc/online.js
          node --check electron/online/addonDash.js
          node --check electron/online/addonHybrid.js
          node --check electron/online/stagedMediaTrim.js
          node --check electron/main.js
          node --check electron/online/addonHybridCenc.js
          node --check electron/lyrics/flacVorbis.js
          node --check electron/lyrics/providers/local.js
          node --check electron/lyrics/service.js
      - name: Verify LastWave HTTP, DASH, encrypted hybrid and supporting vocals
        run: |
          node --test \
            scripts/lastwave-desktop-port.test.mjs \
            scripts/lastwave-diagnostics.test.mjs \
            scripts/album-full-artwork.test.mjs \
            scripts/lastwave-hybrid-cenc.test.mjs \
            scripts/staged-media-cache-trim.test.mjs \
            scripts/desktop-background-lyrics-port.test.mjs \
            scripts/lyrics-focus-hold.test.mjs \
            scripts/http-addon-signing.test.mjs \
            scripts/enhanced-lrc-background.test.mjs
      - name: Install frontend dependencies without running native postinstall
        run: npm ci --ignore-scripts
      - name: Compile full desktop lyrics renderer
        run: npx vite build
